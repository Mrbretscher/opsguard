[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsguard"
version = "0.1.0"
description = "Lean scikit-learn predictive-maintenance baseline for the UCI AI4I 2020 dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "OpsGuard Contributors" }
]
dependencies = [
  "numpy>=2.4,<3",
  "pandas>=3.0,<4",
  "scikit-learn>=1.9,<2",
  "matplotlib>=3.11,<4",
  "ucimlrepo>=0.0.7,<0.1",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.64,<2",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "pandas-stubs>=3.0.5.260730,<3.1",
    "jupyterlab>=4.6,<5",
]

[project.scripts]
opsguard = "opsguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]
markers = [
  "integration: tests that require external services or network access",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
packages = ["opsguard"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "sklearn.*",
  "streamlit.*",
  "ucimlrepo.*",
]
ignore_missing_imports = true
